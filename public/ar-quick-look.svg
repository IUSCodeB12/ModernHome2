<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="View in AR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211d19"/>
      <stop offset="1" stop-color="#151311"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.6" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffb163" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffb163" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#glow)"/>

  <!-- AR cube -->
  <g fill="none" stroke="#c9a24b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M320 150 L400 194 L400 286 L320 330 L240 286 L240 194 Z"/>
    <path d="M320 150 L320 240 L400 286" stroke-opacity="0.75"/>
    <path d="M320 240 L240 286" stroke-opacity="0.75"/>
  </g>

  <text x="320" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="26" font-weight="600" fill="#f5efe6">Tap to view in your room</text>
</svg>
